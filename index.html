<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Game Flavortown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-panel">
            <div class="panel-header">
                <h1>Flight Control</h1>
                <p class="panel-subtitle">Mission status and planet settings</p>
            </div>

            <div class="panel-section">
                <h2>Environment</h2>
                <label class="field-label">Current Planet</label>
                <select id="planet-select">
                    <option value="earth">Earth</option>
                    <option value="moon">Moon</option>
                    <option value="mars">Mars</option>
                    <option value="venus">Venus</option>
                    <option value="jupiter">Jupiter</option>
                    <option value="zero">Zero-G</option>
                </select>
                <div class="info-row"><span>Planet:</span> <strong id="planet-name">Earth</strong></div>
            </div>

            <div class="panel-section">
                <h2>Rocket Setup</h2>
                <label class="field-label">Fuel Reserve</label>
                <div class="slider-row">
                    <input type="range" id="fuel-slider" min="50" max="500" step="10" value="100">
                    <span class="slider-value" id="fuel-value">100</span>
                </div>
                <p class="field-note">Choose launch fuel before takeoff.</p>
            </div>

            <div class="panel-section controls-panel">
                <h2>Controls</h2>
                <div class="control-item"><span>W / ↑</span><em>Main thrust</em></div>
                <div class="control-item"><span>A / ←</span><em>Rotate left</em></div>
                <div class="control-item"><span>D / →</span><em>Rotate right</em></div>
                <div class="control-item"><span>S / ↓</span><em>Downward thrust</em></div>
            </div>

            <div class="panel-section buttons-panel">
                <button id="launch-btn" class="primary-btn">Launch</button>
                <button id="reset-btn" class="secondary-btn">Reset</button>
            </div>
        </div>
        <div id="game-canvas"></div>
    </div>
    <script src="script.js?v=11"></script>
</body>
</html>
